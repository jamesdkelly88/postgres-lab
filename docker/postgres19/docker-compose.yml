services:
  postgres19:
    container_name: postgres19
    environment:
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_PASSWORD: ${PGPASSWORD}
    image: postgres:19beta4-alpine3.24
    ports:
    - 5432:5432
    restart: unless-stopped
    volumes:
    - data:/var/lib/postgresql

networks:
  default:
    name: postgres19

volumes:
  data: